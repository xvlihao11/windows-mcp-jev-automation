name: Workflow unit tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Listener and routing tests (no live API or desktop)
        run: python -m unittest discover -s asphalt-daily -p 'test_*.py'
      - name: Executor tests (mocked desktop)
        run: python -m unittest discover -s asphalt-daily/wincli-trial -p 'test_*.py'
